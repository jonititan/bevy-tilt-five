[package]
name = "bevy_tilt_five"
version = "0.2.0"
edition = "2021"
description = "A Bevy plugin for the Tilt Five AR headset"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lee-orr/bevy-tilt-five"

[features]
default = []
sdk-1-5 = []
mixcast = ["dep:ffmpeg-sidecar"]

[dependencies]
bevy = { version = "0.14", default-features = true }
anyhow = "1"
thiserror = "1"
libloading = "0.8"
once_cell = "1"
bytemuck = "1"
crossbeam-channel = "0.5"

ffmpeg-sidecar = { version = "1", optional = true }

[target.'cfg(target_family = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "linux")'.dependencies]
glow = "0.14"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"

[build-dependencies]
bindgen = "0.70"

[dev-dependencies]
bevy-inspector-egui = "0.25"
bevy_egui = "0.28"

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "wand_demo"
path = "examples/wand_demo.rs"

[[example]]
name = "mixcast_demo"
path = "examples/mixcast_demo.rs"
required-features = ["mixcast"]
